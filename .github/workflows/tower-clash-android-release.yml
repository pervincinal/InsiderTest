name: tower-clash-android-release

# Signed Google Play build of the Capacitor Android shell: release .aab (for Play Console) and a
# release .apk (sideload on a phone), both signed with the UPLOAD key, from a GitHub-hosted
# ubuntu runner. Mirrors tower-clash-ios-release.yml. Nothing needs a computer: the upload
# keystore itself can be generated by tower-clash-android-keystore.yml (docs/MOBILE.md §6).
#
# Signing
#   android/app/build.gradle reads ANDROID_KEYSTORE_FILE / ANDROID_KEYSTORE_PASSWORD /
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD from the environment (it falls back to the debug
#   key when one is missing). This job decodes the secret ANDROID_KEYSTORE_BASE64 to
#   $RUNNER_TEMP/release.jks and exports the four variables. Defaults applied HERE, not in
#   build.gradle:
#     ANDROID_KEY_ALIAS    -> towerclash (the alias the keystore workflow uses)
#     ANDROID_KEY_PASSWORD -> ANDROID_KEYSTORE_PASSWORD (keytool's PKCS12 stores, the default
#                             since JDK 9 and what the keystore workflow makes, have one password)
#   So the minimum is two secrets: ANDROID_KEYSTORE_BASE64 + ANDROID_KEYSTORE_PASSWORD.
#   With Play App Signing, Google re-signs the app with its own app signing key; ours is only the
#   upload key (lost upload key = Play support "upload key reset", not a lost app).
#
# Verification (after Gradle): the keystore is opened with keytool before the build (wrong
# password / alias fails in seconds), and after the build both outputs must carry exactly that
# certificate (SHA-256 compared) -- this also catches a silent fall-back to the debug key.
#   .aab -> `jarsigner -verify` + `keytool -printcert -jarfile` (bundles are JAR-signed; apksigner
#           does not read .aab files)
#   .apk -> `apksigner verify --print-certs` from the newest SDK build-tools (installed by
#           setup-android below); minSdk 24 means AGP signs with the v2/v3 scheme only, which
#           jarsigner cannot see, so if apksigner were missing the APK check is skipped with a
#           warning rather than failing on a false "unsigned".
#
# Triggers (MM-13, docs/MOBILE.md §6 "Android"): the agent team cannot call workflow_dispatch
# or push tags (its GitHub proxy blocks both) and the stakeholder cannot push tags from an
# iPhone, so a build is requested by a commit: a push to the working branch that changes
# tower-clash/release/android-release.request runs the job once with the `track` / `status`
# written in that file (scripts/releaseRequest.mjs). Pushes to other branches never build.
# workflow_dispatch (track input) and the `tower-clash-v*` tag (track internal) still work. The
# former "push of this workflow file" trigger was removed with MM-13 (as MM-12 did for iOS):
# once the secrets exist, editing the workflow must never start a real Play upload — only a
# request does.
#
# Track (internal | closed | production, default internal) and Play status (draft | completed,
# default draft; dispatch and tag runs always use draft). Play API track names: internal, alpha
# (= closed testing), production. The upload step (r0adkll/upload-google-play) runs only when the
# secret PLAY_SERVICE_ACCOUNT_JSON exists:
#   internal           without the secret: build + sign only; the summary says the upload was
#                      SKIPPED and names the .aab artifact to upload by hand in Play Console
#   closed/production  a REQUEST without the secret stops right after reading the request file,
#                      before anything is built (nobody would upload that build by hand on
#                      time); a manual "Run workflow" still builds and leaves the upload to a
#                      person
#   status draft       the release waits in Play Console for "Review release" -> "Start rollout"
#   status completed   Play rolls the release out by itself (production: after Google's review).
#                      Google refuses anything but draft while the app has never been rolled out
#                      ("Only releases with status draft may be created on draft app").
# The very first .aab of a new app must be uploaded by hand in Play Console (the API cannot
# create the first release), see docs/MOBILE.md §6.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track: internal (default) / closed / production — used for the optional Play upload (always a draft) and the summary'
        type: choice
        options:
          - internal
          - closed
          - production
        default: internal
  push:
    tags:
      - 'tower-clash-v*'
    # Commit-triggered builds (MM-13): only a change of the request file on the working branch
    # starts a run (paths filters do not apply to the tag pushes above). Track and status are
    # read from the file after the checkout. Without the secrets the run stops at "Check
    # required secrets".
    branches:
      - claude/tower-war-game-plan-weqwpb
    paths:
      - 'tower-clash/release/android-release.request'

# Never cancel a run that may be in the middle of an upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: signed AAB + APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      # Track of a manual run / tag run; a request run replaces it with the file's `track`
      # (step "Read the request file and choose the Play track" writes TRACK to $GITHUB_ENV).
      DISPATCH_TRACK: ${{ github.event.inputs.track || 'internal' }}
      PACKAGE_NAME: com.pervincinal.towerclash
    defaults:
      run:
        working-directory: tower-clash
    steps:
      # Fail fast with the exact list of missing secrets before anything is checked out.
      - name: Check required secrets
        working-directory: ${{ runner.temp }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions. No computer? Create ANDROID_KEYSTORE_PASSWORD, then run the workflow 'tower-clash-android-keystore' — it makes ANDROID_KEYSTORE_BASE64 for you (docs/MOBILE.md section 6, Android)."
            exit 1
          fi
          if [ -n "$ANDROID_KEY_ALIAS" ]; then echo "ANDROID_KEY_ALIAS: set"; else echo "ANDROID_KEY_ALIAS: not set -> using the default 'towerclash'"; fi
          if [ -n "$ANDROID_KEY_PASSWORD" ]; then echo "ANDROID_KEY_PASSWORD: set"; else echo "ANDROID_KEY_PASSWORD: not set -> using ANDROID_KEYSTORE_PASSWORD"; fi
          # Only "set" / "not set" is printed; a pasted file that is not the JSON key fails here
          # instead of at the end of a 20-minute build.
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            if [[ "$PLAY_SERVICE_ACCOUNT_JSON" != *'"client_email"'* || "$PLAY_SERVICE_ACCOUNT_JSON" != *'"private_key"'* ]]; then
              echo "::error::PLAY_SERVICE_ACCOUNT_JSON does not look like a Google Cloud service-account JSON key (no client_email / private_key). Paste the whole text of the downloaded .json file (docs/publishing/LAUNCH_CHECKLIST.md G4b)."
              exit 1
            fi
            echo "PLAY_SERVICE_ACCOUNT_JSON: set"
            echo "HAS_PLAY_SA=true" >> "$GITHUB_ENV"
          else
            echo "PLAY_SERVICE_ACCOUNT_JSON: not set -> no automatic Play upload"
            echo "HAS_PLAY_SA=false" >> "$GITHUB_ENV"
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            echo "Track: read from tower-clash/release/android-release.request after the checkout"
          else
            echo "Track: $DISPATCH_TRACK"
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tower-clash/package-lock.json

      # Request runs (a push of release/android-release.request): track + status from the file.
      # Manual / tag runs: the input track (tag: internal), always draft. A closed / production
      # REQUEST without PLAY_SERVICE_ACCOUNT_JSON stops here, before anything is built.
      - name: Read the request file and choose the Play track
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ]; then
            node scripts/releaseRequest.mjs android-release release/android-release.request --env > "$RUNNER_TEMP/request.env"
            TRACK="$(sed -n 's/^TRACK=//p' "$RUNNER_TEMP/request.env")"
            PLAY_STATUS="$(sed -n 's/^PLAY_STATUS=//p' "$RUNNER_TEMP/request.env")"
            REQUEST_RUN=true
          else
            TRACK="$DISPATCH_TRACK"
            PLAY_STATUS=draft
            REQUEST_RUN=false
          fi
          case "$TRACK" in
            internal) PLAY_TRACK=internal ;;
            closed) PLAY_TRACK=alpha ;;
            production) PLAY_TRACK=production ;;
            *) echo "::error::Unknown track '$TRACK'"; exit 1 ;;
          esac
          if [ "$REQUEST_RUN" = true ] && [ "$TRACK" != internal ] && [ "$HAS_PLAY_SA" != true ]; then
            MSG="track=$TRACK needs the repository secret PLAY_SERVICE_ACCOUNT_JSON (automatic Play upload), which does not exist. Nothing was built. Either the stakeholder adds it (docs/publishing/LAUNCH_CHECKLIST.md G4b) and the team commits the request again with a new requested=, or request track=internal and upload the .aab by hand."
            echo "::error::$MSG"
            {
              echo "## Tower Clash Android request refused: track=$TRACK"
              echo
              echo "$MSG"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "TRACK=$TRACK"
            echo "PLAY_TRACK=$PLAY_TRACK"
            echo "PLAY_STATUS=$PLAY_STATUS"
            echo "REQUEST_RUN=$REQUEST_RUN"
          } >> "$GITHUB_ENV"
          if [ "$HAS_PLAY_SA" = true ]; then UPLOAD="yes, status $PLAY_STATUS"; else UPLOAD="no - the .aab is uploaded by hand in Play Console"; fi
          echo "Track: $TRACK (Play API track '$PLAY_TRACK'). Automatic Play upload: $UPLOAD"

      - name: Install dependencies
        run: npm ci

      # versionName / versionCode in build.gradle must match package.json (`npm run version:sync`);
      # Google Play rejects a versionCode it has seen before.
      - name: Native version numbers match package.json
        run: npm run version:check

      - name: Read version and check the tag
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CODE="$(node -p "require('./package.json').config.buildNumber")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building Tower Clash $VERSION ($CODE), track $TRACK, ref $GITHUB_REF"
          case "$GITHUB_REF" in
            refs/tags/*)
              if [ "$GITHUB_REF" != "refs/tags/tower-clash-v$VERSION" ]; then
                echo "::error::Tag $GITHUB_REF does not match package.json version $VERSION (expected tower-clash-v$VERSION). Fix the tag or the version (LAUNCH_CHECKLIST.md V3)."
                exit 1
              fi ;;
            *)
              # A request commit pins the source as well as a tag does (its sha is in the run).
              if [ "$TRACK" = "production" ] && [ "$REQUEST_RUN" != "true" ]; then echo "::warning::Track 'production' built from $GITHUB_REF, not from the tag tower-clash-v$VERSION or a request commit — fine for a test, but use a request (release/android-release.request) or the tag for the real store build (LAUNCH_CHECKLIST.md V3)."; fi ;;
          esac

      # Monetization ids (docs/MOBILE.md §8.3): identical to tower-clash-android.yml. Missing
      # secrets fall back to "store unavailable" + Google's TEST ad units — fine for internal
      # testing, not for production, hence the warning.
      - name: Write .env.production from repository secrets
        env:
          VITE_RC_ANDROID_KEY: ${{ secrets.RC_ANDROID_KEY }}
          VITE_ADMOB_ANDROID_INTERSTITIAL: ${{ secrets.ADMOB_ANDROID_INTERSTITIAL }}
          VITE_ADMOB_ANDROID_REWARDED: ${{ secrets.ADMOB_ANDROID_REWARDED }}
          # MM-10 rating prompt (docs/MOBILE.md §8.8): a repository VARIABLE, not a secret (not
          # sensitive). Exactly `on` enables it; unset/anything else = off. Release workflows only.
          VITE_RATING_PROMPT: ${{ vars.RATING_PROMPT }}
        run: |
          : > .env.production
          for name in VITE_RC_ANDROID_KEY VITE_ADMOB_ANDROID_INTERSTITIAL VITE_ADMOB_ANDROID_REWARDED; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s=%s\n' "$name" "$value" >> .env.production
              echo "$name: set"
            else
              echo "$name: not configured (safe default)"
              if [ "$TRACK" = "production" ]; then echo "::warning::$name is not configured — the production build will ship without it (store unavailable / test ads)"; fi
            fi
          done
          if [ "$VITE_RATING_PROMPT" = "on" ]; then
            printf 'VITE_RATING_PROMPT=on\n' >> .env.production
            echo "VITE_RATING_PROMPT: on (rating prompt enabled in this build)"
          else
            echo "VITE_RATING_PROMPT: off (repository variable RATING_PROMPT is '${VITE_RATING_PROMPT}', not 'on')"
          fi

      # The AdMob APP id (ca-app-pub-…~…, not an ad unit) lives in strings.xml; a wrong value
      # crashes the app at startup, so only replace it when the secret is set.
      - name: Set AdMob app id (Android)
        env:
          ADMOB_ANDROID_APP_ID: ${{ secrets.ADMOB_ANDROID_APP_ID }}
        run: |
          if [ -z "$ADMOB_ANDROID_APP_ID" ]; then
            echo "ADMOB_ANDROID_APP_ID not configured — keeping the AdMob TEST app id"
            if [ "$TRACK" = "production" ]; then echo "::warning::ADMOB_ANDROID_APP_ID is not configured — the production build will use Google's TEST AdMob app id"; fi
            exit 0
          fi
          case "$ADMOB_ANDROID_APP_ID" in
            ca-app-pub-*~*) ;;
            *) echo "ADMOB_ANDROID_APP_ID must look like ca-app-pub-XXXX~YYYY (an APP id, not an ad unit)"; exit 1 ;;
          esac
          sed -i "s#ca-app-pub-3940256099942544~3347511713#${ADMOB_ANDROID_APP_ID}#" android/app/src/main/res/values/strings.xml
          grep -q "$ADMOB_ANDROID_APP_ID" android/app/src/main/res/values/strings.xml

      - name: Build web app
        run: npm run build

      - name: Sync web build into the Android project
        run: npx cap sync android

      # JDK 21, not 17: the AdMob and RevenueCat plugins are Kotlin modules compiled for Java 21
      # (same toolchain as tower-clash-android.yml, which builds them on every push).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          # Only what the project needs (the action's default list includes the retired 'tools'
          # package). build-tools also provides apksigner for the verification step.
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - uses: gradle/actions/setup-gradle@v4

      # Accepts the base64 text with or without line breaks / spaces (pasted on a phone). Opening
      # the keystore here turns a wrong password or alias into a clear error before the build.
      - name: Decode and check the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'towerclash' }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 --decode > "$KEYSTORE" 2>/dev/null || [ ! -s "$KEYSTORE" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64. Paste the whole text of release.jks.base64.txt (one line) as the secret value."
            exit 1
          fi
          chmod 600 "$KEYSTORE"
          if ! keytool -list -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::The keystore does not open with ANDROID_KEYSTORE_PASSWORD (wrong password, or ANDROID_KEYSTORE_BASE64 is not the keystore text)."
            exit 1
          fi
          if ! keytool -list -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::The keystore has no key with alias '$ANDROID_KEY_ALIAS'. Aliases inside it:"
            keytool -list -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD | awk -F, '/PrivateKeyEntry/ {print "  " $1}'
            exit 1
          fi
          SHA256="$(keytool -list -v -keystore "$KEYSTORE" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | awk '/SHA256:/ {print $2; exit}')"
          test -n "$SHA256"
          echo "UPLOAD_CERT_SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "Upload keystore OK: alias $ANDROID_KEY_ALIAS, certificate SHA-256 $SHA256"

      - name: Build signed AAB and APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'towerclash' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"
          # build.gradle prints which key it used; the debug fallback must never reach Play.
          if grep -q "release build uses the DEBUG key" "$RUNNER_TEMP/gradle.log"; then
            echo "::error::Gradle fell back to the debug key — ANDROID_KEYSTORE_* did not reach build.gradle"
            exit 1
          fi
          ls -la app/build/outputs/bundle/release/ app/build/outputs/apk/release/

      - name: Verify signatures (same certificate as the keystore)
        run: |
          norm() { tr -d ': \n' | tr 'A-F' 'a-f'; }
          EXPECTED="$(printf '%s' "$UPLOAD_CERT_SHA256" | norm)"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          APK="$(ls android/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)"
          test -f "$AAB"
          test -n "$APK" && test -f "$APK"

          echo "== AAB: jarsigner -verify"
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/jarsigner.txt"
          grep -q "jar verified" "$RUNNER_TEMP/jarsigner.txt"
          AAB_SHA="$(keytool -printcert -jarfile "$AAB" | awk '/SHA256:/ {print $2; exit}' | norm)"
          if [ "$AAB_SHA" != "$EXPECTED" ]; then
            echo "::error::The AAB is signed with certificate $AAB_SHA, expected the upload key $EXPECTED"
            exit 1
          fi
          echo "AAB signed with the upload key ($AAB_SHA)"

          echo "== APK: apksigner verify"
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          APKSIGNER="$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found under $SDK/build-tools — APK signature not verified (jarsigner cannot see v2/v3 signatures). The AAB, which is what Play receives, was verified."
          else
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
            APK_SHA="$(awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' "$RUNNER_TEMP/apksigner.txt" | norm)"
            if [ "$APK_SHA" != "$EXPECTED" ]; then
              echo "::error::The APK is signed with certificate $APK_SHA, expected the upload key $EXPECTED"
              exit 1
            fi
            echo "APK signed with the upload key ($APK_SHA)"
          fi

      - name: Name the outputs
        run: |
          OUT="$RUNNER_TEMP/release-out"
          mkdir -p "$OUT"
          BASE="tower-clash-${{ steps.version.outputs.version }}-${{ steps.version.outputs.code }}"
          cp android/app/build/outputs/bundle/release/app-release.aab "$OUT/$BASE.aab"
          cp "$(ls android/app/build/outputs/apk/release/*.apk | grep -v unsigned | head -n1)" "$OUT/$BASE.apk"
          echo "RELEASE_OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$OUT"

      - name: Upload .aab artifact
        uses: actions/upload-artifact@v4
        with:
          name: tower-clash-android-${{ steps.version.outputs.version }}-${{ steps.version.outputs.code }}-aab
          path: ${{ env.RELEASE_OUT }}/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: tower-clash-android-${{ steps.version.outputs.version }}-${{ steps.version.outputs.code }}-apk
          path: ${{ env.RELEASE_OUT }}/*.apk
          if-no-files-found: error
          retention-days: 90

      # Optional: only when the secret PLAY_SERVICE_ACCOUNT_JSON exists (docs/MOBILE.md §6). Status
      # draft (default; manual and tag runs always) or completed (request status=completed: Play
      # rolls it out by itself). inAppUpdatePriority is deliberately not set. Fails for a
      # brand-new app until the first .aab was uploaded by hand in Play Console. Third-party
      # action: pin it to a commit SHA if the repo ever gets stricter supply-chain rules.
      - name: Upload to Google Play (optional)
        if: env.HAS_PLAY_SA == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.RELEASE_OUT }}/*.aab
          releaseName: ${{ steps.version.outputs.version }} (${{ steps.version.outputs.code }})
          track: ${{ env.PLAY_TRACK }}
          status: ${{ env.PLAY_STATUS }}

      - name: Summary
        run: |
          V="${{ steps.version.outputs.version }}"; C="${{ steps.version.outputs.code }}"
          case "$TRACK" in
            internal) TRACK_PATH="Test and release -> Testing -> Internal testing" ;;
            closed) TRACK_PATH="Test and release -> Testing -> Closed testing -> (your track, e.g. Alpha)" ;;
            production) TRACK_PATH="Test and release -> Production" ;;
          esac
          {
            echo "## Tower Clash Android $V (versionCode $C) — signed, track $TRACK"
            echo
            if [ "$REQUEST_RUN" = "true" ]; then echo "Started by a change of tower-clash/release/android-release.request (commit $GITHUB_SHA)."; else echo "Started by $GITHUB_EVENT_NAME on $GITHUB_REF."; fi
            echo
            echo "Upload key certificate SHA-256: \`$UPLOAD_CERT_SHA256\`"
            echo
            echo "Artifacts (90 days): **tower-clash-android-$V-$C-aab** (for Google Play) and **tower-clash-android-$V-$C-apk** (installs directly on an Android phone)."
            echo
            AAB_ARTIFACT="tower-clash-android-$V-$C-aab"
            if [ "$HAS_PLAY_SA" = "true" ]; then
              if [ "$PLAY_STATUS" = "completed" ]; then
                echo "**Play upload: done, status completed** on track \`$PLAY_TRACK\` — Play rolls the release out by itself (testers get it within minutes; production goes to Google's review first, then to every user)."
                echo
                echo "Check: https://play.google.com/console -> Tower Clash -> $TRACK_PATH -> release $V ($C) and *Publishing overview*."
              else
                echo "**Play upload: done, status draft** on track \`$PLAY_TRACK\`. Nothing reaches users yet."
                echo
                echo "Next (Play Console, in the browser):"
                echo "1. https://play.google.com/console -> Tower Clash -> $TRACK_PATH -> the draft release $V ($C) -> **Next** -> fix any warnings -> **Save and publish** / **Start rollout**."
              fi
            else
              echo "**Play upload: SKIPPED** — the repository secret PLAY_SERVICE_ACCOUNT_JSON is not set (LAUNCH_CHECKLIST.md G4b). The stakeholder uploads **$AAB_ARTIFACT** by hand (Play Console, in the browser — works in Safari on the iPhone):"
              echo "1. Download the artifact **$AAB_ARTIFACT** from this page (Safari saves a .zip; Files app -> tap it to unzip -> \`tower-clash-$V-$C.aab\`)."
              echo "2. https://play.google.com/console -> Tower Clash -> $TRACK_PATH -> **Create new release**."
              echo "3. First release only: under *App integrity* / *Play App Signing* keep **Use Google-generated key** (Play App Signing; our key becomes the upload key) -> Continue."
              echo "4. **Upload** -> choose the .aab from Files -> release name \`$V ($C)\` -> release notes from docs/publishing/RELEASE_NOTES.md -> **Next** -> **Save and publish** (internal / closed) or **Send for review** (production)."
            fi
            echo
            echo "Internal testing: add testers' Gmail addresses under the track's *Testers* tab and share the opt-in link. Closed testing on a new personal account: 12+ testers for 14 days before production access (LAUNCH_CHECKLIST.md G19). Every new upload needs a higher versionCode: bump \`config.buildNumber\` in package.json + \`npm run version:sync\`."
          } >> "$GITHUB_STEP_SUMMARY"
          # Annotation as well: the team reads annotations through the check-runs API, not the
          # summary page.
          if [ "$HAS_PLAY_SA" != "true" ]; then
            echo "::notice::Play upload SKIPPED (no PLAY_SERVICE_ACCOUNT_JSON). Upload the artifact $AAB_ARTIFACT by hand: Play Console -> Tower Clash -> $TRACK_PATH -> Create new release."
          fi

      - name: Remove the keystore
        if: always()
        working-directory: ${{ github.workspace }}
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/gradle.log"
