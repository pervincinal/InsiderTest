name: tower-clash-android-keystore

# Creates the Google Play UPLOAD keystore on a GitHub runner, for a stakeholder who has only an
# iPhone (no terminal, no keytool, no computer). Run it ONCE. Normally the team starts it by
# committing tower-clash/release/android-keystore.request after the stakeholder wrote that the
# password secret exists ("parol sirrini əlavə etdim"); see "Triggers" below. Walk-through:
# docs/MOBILE.md §6 "Android", LAUNCH_CHECKLIST.md G3 / G4.
#
# Why a CI-generated key is acceptable: with Play App Signing (the default for every new app in
# Play Console) the key that signs the app on users' phones -- the APP SIGNING key -- is created
# and kept by Google. What this workflow makes is only the UPLOAD key, which proves to Google
# that an upload comes from us. If the upload key is ever lost or leaks, the account owner asks
# Play support for an upload key reset (Play Console -> Test and release -> App integrity ->
# "Request upload key reset"; a new upload certificate is registered, the app keeps updating).
# So a lost upload key costs a support ticket and a few days, not the app.
#
# What it does
#   1. reads the password from the repository secret ANDROID_KEYSTORE_PASSWORD (the stakeholder
#      creates that secret first, e.g. with the iPhone's "Strong Password" suggestion); fails if
#      it is absent or shorter than 12 characters;
#   2. keytool -genkeypair -alias towerclash -keyalg RSA -keysize 2048 -validity 10000
#      (PKCS12 store; key password = keystore password -- PKCS12 cannot hold two passwords);
#   3. writes release.jks.base64.txt (one line of base64 = the value of the secret
#      ANDROID_KEYSTORE_BASE64) plus upload_certificate.pem (public certificate, needed only for
#      a Play "upload key reset") and uploads both as the artifact "android-upload-keystore",
#      kept for 1 day only;
#   4. prints only public facts (alias, certificate SHA-256 fingerprint, validity) -- never the
#      password and never the keystore contents.
#
# Security note: Actions artifacts can be downloaded by anyone who can read the repository. The
# keystore inside the artifact is encrypted with ANDROID_KEYSTORE_PASSWORD (PKCS12, PBES2/AES),
# so it is only as safe as that password -- hence the 12-character minimum, the 1-day retention
# and the advice to delete the artifact as soon as its text is copied.
#
# Re-running: if ANDROID_KEYSTORE_BASE64 already exists the job refuses, unless the input
# replace_existing is ticked (or the request file says replace_existing=yes) -- a new key does NOT
# replace the one Google already knows; after the first Play upload a new upload key also needs
# the upload key reset described above.
#
# Triggers: GitHub shows the "Run workflow" button only for workflows that exist on the DEFAULT
# branch (main), and main carries no workflows today; the agent team cannot call
# workflow_dispatch at all. So a push to the working branch starts the job when it changes
#   * tower-clash/release/android-keystore.request (MM-13, the normal path): the team commits it
#     with a new `requested=` once the stakeholder has created ANDROID_KEYSTORE_PASSWORD. Keys:
#     generate=yes|no (no = read the file and stop), replace_existing=no|yes, note, requested
#     (scripts/releaseRequest.mjs);
#   * this workflow file itself (kept on purpose -- the run fails at "Check secrets" while
#     ANDROID_KEYSTORE_PASSWORD is missing, and the stakeholder can open it in Actions and press
#     "Re-run all jobs" from Safari after creating the password secret). Such a run also reads
#     the request file of its commit; a commit without that file means generate=yes,
#     replace_existing=no.
# A re-run reads the secrets as they are at that moment. The secrets check is always the first
# step; the request file is read after it.
on:
  workflow_dispatch:
    inputs:
      replace_existing:
        description: 'Tick ONLY if you really want a new upload key although ANDROID_KEYSTORE_BASE64 already exists (needs a Play "upload key reset" if the old key was already used)'
        type: boolean
        default: false
  push:
    branches:
      - claude/tower-war-game-plan-weqwpb
    paths:
      - '.github/workflows/tower-clash-android-keystore.yml'
      - 'tower-clash/release/android-keystore.request'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  keystore:
    name: generate upload keystore
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KEY_ALIAS: towerclash
    steps:
      - name: Check secrets
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REPLACE_EXISTING: ${{ github.event.inputs.replace_existing }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Missing repository secret: ANDROID_KEYSTORE_PASSWORD. Create it first (Settings -> Secrets and variables -> Actions -> New repository secret), at least 12 characters, then run this workflow again (or tell the team 'parol sirrini əlavə etdim'). docs/MOBILE.md section 6."
            exit 1
          fi
          if [ "${#ANDROID_KEYSTORE_PASSWORD}" -lt 12 ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD is too short (${#ANDROID_KEYSTORE_PASSWORD} characters, need at least 12). Edit the secret and use a long random password, e.g. the iPhone 'Strong Password' suggestion."
            exit 1
          fi
          echo "Password secret present (${#ANDROID_KEYSTORE_PASSWORD} characters). Alias: $KEY_ALIAS"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then echo "HAS_KEYSTORE_BASE64=true" >> "$GITHUB_ENV"; else echo "HAS_KEYSTORE_BASE64=false" >> "$GITHUB_ENV"; fi
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            {
              echo "GENERATE=yes"
              if [ "$REPLACE_EXISTING" = "true" ]; then echo "REPLACE_EXISTING=yes"; else echo "REPLACE_EXISTING=no"; fi
            } >> "$GITHUB_ENV"
          else
            echo "generate / replace_existing: read from tower-clash/release/android-keystore.request in the next steps"
          fi

      # Push runs only: the request file decides (MM-13). Only the release/ folder and the
      # parser are checked out; nothing else of the repository is needed to make a key.
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          sparse-checkout: |
            tower-clash/release
            tower-clash/scripts

      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version: 22

      - name: Read the request file
        if: github.event_name == 'push'
        run: |
          REQUEST=tower-clash/release/android-keystore.request
          if [ -f "$REQUEST" ]; then
            node tower-clash/scripts/releaseRequest.mjs android-keystore "$REQUEST" --env >> "$GITHUB_ENV"
          else
            echo "$REQUEST is not in this commit: generate=yes, replace_existing=no (the behaviour before MM-13)"
            printf 'GENERATE=yes\nREPLACE_EXISTING=no\n' >> "$GITHUB_ENV"
          fi

      - name: Decide
        run: |
          echo "generate=$GENERATE replace_existing=$REPLACE_EXISTING existing ANDROID_KEYSTORE_BASE64=$HAS_KEYSTORE_BASE64"
          if [ "$GENERATE" != "yes" ]; then
            echo "::notice::generate=no in tower-clash/release/android-keystore.request - nothing was generated."
            echo "## Android upload key: not generated (generate=no in the request file)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$HAS_KEYSTORE_BASE64" = "true" ] && [ "$REPLACE_EXISTING" != "yes" ]; then
            echo "::error::The secret ANDROID_KEYSTORE_BASE64 already exists, so an upload key was made before. Nothing was generated. If you really need a new key: replace_existing=yes in tower-clash/release/android-keystore.request (or tick 'replace_existing' in Run workflow) - docs/MOBILE.md section 6, 'Lost or replaced upload key'."
            exit 1
          fi

      - uses: actions/setup-java@v4
        if: env.GENERATE == 'yes'
        with:
          distribution: temurin
          java-version: 21

      - name: Generate the upload keystore
        if: env.GENERATE == 'yes'
        working-directory: ${{ runner.temp }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -m 700 keystore-out
          cd keystore-out
          # -storepass:env / -keypass:env read the password from the environment, so it never
          # appears on a command line or in the log.
          keytool -genkeypair -noprompt \
            -keystore release.jks -storetype PKCS12 \
            -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Tower Clash, O=pervincinal" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            -keypass:env ANDROID_KEYSTORE_PASSWORD
          base64 -w0 release.jks > release.jks.base64.txt
          # Round trip: the text decodes back to a keystore that opens with the password.
          base64 --decode release.jks.base64.txt > roundtrip.jks
          cmp release.jks roundtrip.jks
          keytool -list -keystore roundtrip.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$KEY_ALIAS" > /dev/null
          SHA256="$(keytool -list -v -keystore release.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | awk '/SHA256:/ {print $2; exit}')"
          VALID_UNTIL="$(keytool -list -v -keystore release.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | sed -n 's/.*until: //p' | head -n1)"
          test -n "$SHA256"
          # Public certificate: the file Play support asks for in an upload key reset.
          keytool -exportcert -rfc -keystore release.jks -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$KEY_ALIAS" -file upload_certificate.pem
          grep -q "BEGIN CERTIFICATE" upload_certificate.pem
          rm -f release.jks roundtrip.jks
          chmod 600 release.jks.base64.txt
          {
            echo "UPLOAD_CERT_SHA256=$SHA256"
            echo "UPLOAD_CERT_VALID_UNTIL=$VALID_UNTIL"
          } >> "$GITHUB_ENV"
          echo "Upload keystore created: alias $KEY_ALIAS, RSA 2048, certificate SHA-256 $SHA256, valid until $VALID_UNTIL"
          echo "release.jks.base64.txt: $(wc -c < release.jks.base64.txt) characters"

      - name: Upload artifact (kept 1 day)
        if: env.GENERATE == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: android-upload-keystore
          path: |
            ${{ runner.temp }}/keystore-out/release.jks.base64.txt
            ${{ runner.temp }}/keystore-out/upload_certificate.pem
          if-no-files-found: error
          retention-days: 1

      - name: Summary — what to do on the iPhone
        if: env.GENERATE == 'yes'
        run: |
          {
            echo "## Android upload key created"
            echo
            echo "Alias \`$KEY_ALIAS\` · RSA 2048 · valid until $UPLOAD_CERT_VALID_UNTIL"
            echo
            echo "Upload certificate SHA-256 (public, not a secret — Play Console shows the same value under *App integrity* after the first upload):"
            echo
            echo "\`$UPLOAD_CERT_SHA256\`"
            echo
            echo "### Do this now on the iPhone (the file is deleted automatically after 1 day)"
            echo "1. Scroll down to **Artifacts** on this page and tap **android-upload-keystore**. Safari downloads a .zip."
            echo "2. Open the **Files** app → *Downloads* → tap the .zip (it unpacks into a folder) → tap **release.jks.base64.txt**. The preview shows one long line of letters."
            echo "3. Press and hold on the text → **Select All** → **Copy**."
            echo "4. Open https://github.com/${{ github.repository }}/settings/secrets/actions/new — *Name* \`ANDROID_KEYSTORE_BASE64\`, *Secret*: paste → **Add secret**. (If GitHub shows the mobile page without *Settings*: tap **aA** in the Safari address bar → *Request Desktop Website*.)"
            echo "5. **Keep a copy** of the file: move release.jks.base64.txt to **iCloud Drive** (Files → long-press → Move), and store it together with the password from the secret ANDROID_KEYSTORE_PASSWORD in your password manager (iPhone Settings → Passwords → the entry → Notes, or 1Password / Bitwarden). GitHub never shows a secret again, so this copy is the only backup."
            echo "6. The zip also holds **upload_certificate.pem** (public, not secret) — keep it next to the text file; Play support asks for it only if the upload key ever has to be reset."
            echo "7. Delete the artifact on this page (trash icon next to it) once steps 4–6 are done."
            echo
            echo "No other secret is needed for signing: the alias defaults to \`towerclash\` and the key password to the keystore password. Then write **\"açar sirri hazırdır\"** in the report thread: the team starts **tower-clash-android-release** by committing \`tower-clash/release/android-release.request\` (docs/MOBILE.md §6)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove key material from the runner
        if: always()
        working-directory: ${{ runner.temp }}
        run: rm -rf keystore-out
