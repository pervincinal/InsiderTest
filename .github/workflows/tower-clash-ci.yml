name: tower-clash-ci

on:
  push:
    paths:
      - 'tower-clash/**'
      - '.github/workflows/tower-clash-ci.yml'
  pull_request:
    paths:
      - 'tower-clash/**'
      - '.github/workflows/tower-clash-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow must never need repository secrets: it runs on forks / pull requests and the web
# build needs no store keys (the fake store and the no-op ads provider are used on the web).
jobs:
  verify:
    name: check + playtest + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    defaults:
      run:
        working-directory: tower-clash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tower-clash/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests, level validation
        run: npm run check

      # Fails when package.json version / buildNumber were bumped without `npm run version:sync`
      # (android/app/build.gradle and ios/App/App.xcodeproj/project.pbxproj must match).
      - name: Native version numbers match package.json
        run: npm run version:check

      - name: Headless playtest (reference player on every level)
        run: npm run playtest

      # Daily Challenge gate (GDD §7.5): the reference player on today's and the next 29 days' challenges
      # (`challengeFor`: level 9–50, fixed seed, twist, no upgrades) over 3 seeds each. Every day's fixed
      # seed must be won and wins/K >= 90 %. Exit 1 on any failed day. Measured 2.5 s at 30 days (2026-09-21); widened to 90 days on 2026-09-28 (QA-11, ≈ 10 s) after the 180-day sweep found a day-33 loss (LV-18).
      - name: Daily challenge gate (90 days x 3 seeds)
        run: npm run playtest -- --daily $(date -u +%F) --days 90 --seeds 3

      # Weekly Challenge gate (GDD §8): the reference player on this week's and the next 25 weeks'
      # challenges (`weeklyFor`: level 33–50, fixed seed, non-plain twist, no upgrades) over 5 seeds
      # each. Every week's fixed seed must be won and wins/K >= 80 % (the 3★ target column is
      # informational: star3 sits at 0.9 × the bot's median by design). The key
      # is the ISO week's Monday (`%u` = 1..7, Monday = 1; `-0 days` is valid GNU date): GNU
      # `'monday this week'` would resolve to the *next* Monday on Tue–Sun and skip the current week.
      # Measured 4.0 s locally (2026-09-21); 9.8 s on 2026-10-19 (K = 3: 6.0 s). Keep K = 5: at K = 3 the
      # 80 % rule demands 3/3 and one lost seed fails the week (QA-29: 2027-03-29 lvl 50 lean 2/3, 4/5 at K = 5).
      - name: Weekly challenge gate (26 weeks x 5 seeds)
        run: npm run playtest -- --weekly "$(date -u -d "-$(( $(date -u +%u) - 1 )) days" +%F)" --weeks 26 --seeds 5

      # Twist pool gate (GDD §7.5 item 3): every pool level (9–50, 42 levels) under each twist over
      # seeds 1..5, gate per level wins/K >= 80 % (4/5). K = 5 is the GDD gate; K = 3 would demand 3/3,
      # which is stricter than the spec. Exit 1 on any failed level. Measured 4.1–5.4 s per twist
      # locally (24 s for all five; daily + weekly + twists together 30.5 s, 2026-09-21).
      - name: Twist pool gate (5 twists x 42 levels x 5 seeds)
        run: |
          for twist in plain lean fastFeet thinWalls reinforced; do
            npm run playtest -- --twist "$twist" --seeds 5 || exit 1
          done

      # Naive human gate (QA-3): the first-time-player model (scripts/lib/naivePlayer.ts: one stream per
      # tower to the nearest non-own tower every 4 s, never unlinks, never boosts) on every level over
      # seeds 1..5; `--gate 1-16` fails the step when a level of 1–8 wins < 4/5 or a level of 9–16
      # < 3/5 at the default 4000 ms reaction (levels 17–50 stay informational). A failed row is a
      # level/design item for the Level Designer, traced with the losing seed before filing. Measured
      # 13 s locally (2026-09-25, all 50 levels; the gate reads the first 16 rows).
      - name: Naive human gate (levels 1-16 x 5 seeds)
        run: npm run playtest -- --naive --seeds 5 --gate 1-16

      - name: Build
        run: npm run build

      # Web bundle guard: the entry chunk (and its modulepreloads) must not contain the native
      # store/ads plugins (they are dynamic imports used only inside the Capacitor shells) and must
      # stay under the 82 kB gzip budget (79.7 kB after PERF-9; GDD §2.0b acceptance 3;
      # scripts/checkBundle.mjs holds the number). `--no-build` reuses the dist/ from the step above.
      - name: Bundle check (no native plugins in the entry chunk, gzip budget)
        run: node scripts/checkBundle.mjs --no-build

      # playwright.config.ts only pins the sandbox binary when /opt/pw-browsers exists,
      # so CI uses the browser matching @playwright/test's own version.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # QA-26: the default `chromium` project (151 tests) runs in the `e2e` matrix job below, two
      # shards in parallel with this job; the two small projects stay here (they need the build
      # above and Chromium, ≈ 4 + 4 tests) so this job keeps its "+ e2e" name, which
      # scripts/ciStatus.mjs requires together with both shards. Both steps call Playwright directly
      # on the dist/ built and bundle-checked above (`npm run e2e:*` would rebuild it twice more).

      # Android WebView emulation (`android-webview` project: Pixel 7 metrics, `; wv)` user agent,
      # touch input): safe-area layout, touch-tap flow with audio unlock, hardware back-button hook,
      # background pause. Kept as its own step so a WebView-only regression is obvious in the log.
      - name: Browser e2e (Android WebView emulation)
        timeout-minutes: 10
        run: npx playwright test --project=android-webview

      # PWA offline path (`pwa` project, QA-8): the only project with the service worker allowed
      # (public/sw.js under a real registration, worker network emulation on): the first launch
      # precaches the shell, the second launch runs offline (title, level 1 from the cache), a cold
      # level chunk fails with the game's offline toast, and it loads once back online. This project
      # alone has `retries: 1` (BUG-16: headless-Chromium stall on a worker-routed chunk, ~1/500
      # boots); its artefacts land in test-results/pwa. Measured 46 s locally for its 4 tests (2026-10-15;
      # WebView 29 s).
      - name: Browser e2e (PWA offline)
        timeout-minutes: 5
        run: npx playwright test --project=pwa

      - name: Upload Playwright report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tower-clash/playwright-report
            tower-clash/test-results
            tower-clash/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 7

  # QA-26: the default Playwright project (`chromium`, Pixel 5 metrics) as a two-shard matrix, in
  # parallel with `verify` (no `needs:`): smoke (title → level select → level 1: select home → rules
  # v3 guide lines → stream that keeps the garrison → win → result; blocked-tap hint through the
  # level 5 wall), content (every authored level loads; wall / water / rock screenshots), camera,
  # tutorial, stalemate hint, daily / weekly, economy, lazy chunks, layers and perf (frame-time budget
  # on the top level). History: one step in `verify` — 468 → 595 s on one worker (2026-10-05..08),
  # QA-17 two workers (`workers: 2`, `fullyParallel: false`: whole spec files per worker, a file's
  # tests in order), then 151 tests at 8.5–9.7 min (2026-10-15).
  # `--shard=N/2` splits by test count in path order, whole files (1.47: a file goes to the shard
  # that holds its first test). The level content suite sits in e2e/integrity/ so its 53 short
  # tests sort after gestures430 instead of second: shard 1 = camera … gestures430 +
  # integrity/content (7 files, 101 tests), shard 2 = layers … weeklyMilestones (16 files, 50
  # tests; 56 since BUG-48 split shopLayout's helmet tests per palette, 2026-10-16, which made the
  # file ≈ 215 → 100 s serial), ≈ 50 / 50 of the run time (as e2e/content.spec.ts it was ≈ 40 / 60;
  # tests/repo/hygiene.test.ts QA-26 pins the split). Each shard rebuilds dist/ from the same commit instead
  # of downloading an artifact from `verify` — `npm run build` (≈ 20 s) is deterministic (content
  # hashes, no time stamps) and running beside `verify` instead of after it takes the whole
  # check + playtest + build time off the critical path. The preview still serves the
  # e2e/tools/snapshotDist.mjs snapshot of dist/ (QA-6 / QA-20 guard), on the shard's own
  # PW_PORT with its own PW_OUTPUT. fail-fast off: a red shard never cancels the other, so one run
  # lists every failing test. Every shard job must report (ciStatus REQUIRED_TOGETHER).
  # Measured 2026-10-15 locally (4 cores, idle, 2 workers): whole project 658 s (151/151) vs
  # shard 1/2 372 s (101/101) and shard 2/2 320 s (50/50). Expected here: ≈ 1.5 min setup + 5–6 min.
  e2e:
    name: e2e (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            port: 4191
          - shard: 2
            port: 4192
    env:
      CI: true
      PW_PORT: ${{ matrix.port }}
      PW_OUTPUT: test-results/shard-${{ matrix.shard }}
    defaults:
      run:
        working-directory: tower-clash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tower-clash/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser e2e (chromium, shard ${{ matrix.shard }}/2)
        timeout-minutes: 15
        run: npx playwright test --project=chromium --shard=${{ matrix.shard }}/2

      - name: Upload Playwright report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e-shard-${{ matrix.shard }}
          path: |
            tower-clash/playwright-report
            tower-clash/test-results
            tower-clash/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 7
