name: tower-clash-ci

on:
  push:
    paths:
      - 'tower-clash/**'
      - '.github/workflows/tower-clash-ci.yml'
  pull_request:
    paths:
      - 'tower-clash/**'
      - '.github/workflows/tower-clash-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check + playtest + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    defaults:
      run:
        working-directory: tower-clash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tower-clash/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests, level validation
        run: npm run check

      - name: Headless playtest (reference player on every level)
        run: npm run playtest

      - name: Build
        run: npm run build

      # playwright.config.ts only pins the sandbox binary when /opt/pw-browsers exists,
      # so CI uses the browser matching @playwright/test's own version.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Runs every spec in e2e/: smoke (title → level select → level 1 → win → result),
      # content (every authored level loads) and perf (frame-time budget on the top level).
      - name: Browser e2e (smoke + content + perf)
        timeout-minutes: 15
        run: npm run e2e

      - name: Upload Playwright report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tower-clash/playwright-report
            tower-clash/test-results
            tower-clash/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 7
