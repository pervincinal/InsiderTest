name: tower-clash-ci

on:
  push:
    paths:
      - 'tower-clash/**'
      - '.github/workflows/tower-clash-ci.yml'
  pull_request:
    paths:
      - 'tower-clash/**'
      - '.github/workflows/tower-clash-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow must never need repository secrets: it runs on forks / pull requests and the web
# build needs no store keys (the fake store and the no-op ads provider are used on the web).
jobs:
  verify:
    name: check + playtest + build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    defaults:
      run:
        working-directory: tower-clash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tower-clash/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, lint, unit tests, level validation
        run: npm run check

      # Fails when package.json version / buildNumber were bumped without `npm run version:sync`
      # (android/app/build.gradle and ios/App/App.xcodeproj/project.pbxproj must match).
      - name: Native version numbers match package.json
        run: npm run version:check

      - name: Headless playtest (reference player on every level)
        run: npm run playtest

      # Daily Challenge gate (GDD §7.5): the reference player on today's and the next 29 days' challenges
      # (`challengeFor`: level 9–50, fixed seed, twist, no upgrades) over 3 seeds each. Every day's fixed
      # seed must be won and wins/K >= 90 %. Exit 1 on any failed day. Measured 2.5 s locally (2026-09-21).
      - name: Daily challenge gate (30 days x 3 seeds)
        run: npm run playtest -- --daily $(date -u +%F) --days 30 --seeds 3

      # Weekly Challenge gate (GDD §8): the reference player on this week's and the next 25 weeks'
      # challenges (`weeklyFor`: level 33–50, fixed seed, non-plain twist, no upgrades) over 5 seeds
      # each. Every week's fixed seed must be won and wins/K >= 80 % (the 3★ target column is
      # informational: star3 sits at 0.9 × the bot's median by design). The key
      # is the ISO week's Monday (`%u` = 1..7, Monday = 1; `-0 days` is valid GNU date): GNU
      # `'monday this week'` would resolve to the *next* Monday on Tue–Sun and skip the current week.
      # Measured 4.0 s locally (2026-09-21).
      - name: Weekly challenge gate (26 weeks x 5 seeds)
        run: npm run playtest -- --weekly "$(date -u -d "-$(( $(date -u +%u) - 1 )) days" +%F)" --weeks 26 --seeds 5

      # Twist pool gate (GDD §7.5 item 3): every pool level (9–50, 42 levels) under each twist over
      # seeds 1..5, gate per level wins/K >= 80 % (4/5). K = 5 is the GDD gate; K = 3 would demand 3/3,
      # which is stricter than the spec. Exit 1 on any failed level. Measured 4.1–5.4 s per twist
      # locally (24 s for all five; daily + weekly + twists together 30.5 s, 2026-09-21).
      - name: Twist pool gate (5 twists x 42 levels x 5 seeds)
        run: |
          for twist in plain lean fastFeet thinWalls reinforced; do
            npm run playtest -- --twist "$twist" --seeds 5 || exit 1
          done

      - name: Build
        run: npm run build

      # Web bundle guard: the entry chunk (and its modulepreloads) must not contain the native
      # store/ads plugins (they are dynamic imports used only inside the Capacitor shells) and must
      # stay under the 80 kB gzip budget (GDD §2.0b acceptance 3; scripts/checkBundle.mjs holds the
      # number). `--no-build` reuses the dist/ from the step above.
      - name: Bundle check (no native plugins in the entry chunk, gzip budget)
        run: node scripts/checkBundle.mjs --no-build

      # playwright.config.ts only pins the sandbox binary when /opt/pw-browsers exists,
      # so CI uses the browser matching @playwright/test's own version.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Default Playwright project (`chromium`, Pixel 5 metrics): smoke (title → level select →
      # level 1: select home → rules v3 guide lines → stream that keeps the garrison → win → result;
      # blocked-tap hint through the level 5 wall), content (every authored level loads; wall / water /
      # rock screenshots), tutorial, daily / weekly, economy, lazy chunks, layers and perf (frame-time
      # budget on the top level).
      - name: Browser e2e (smoke + content + economy + perf)
        timeout-minutes: 15
        run: npm run e2e

      # Android WebView emulation (`android-webview` project: Pixel 7 metrics, `; wv)` user agent,
      # touch input): safe-area layout, touch-tap flow with audio unlock, hardware back-button hook,
      # background pause. Kept as its own step so a WebView-only regression is obvious in the log.
      - name: Browser e2e (Android WebView emulation)
        timeout-minutes: 10
        run: npm run e2e:webview

      - name: Upload Playwright report, traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tower-clash/playwright-report
            tower-clash/test-results
            tower-clash/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 7
