name: tower-clash-pages

# Deploys the production build of tower-clash to GitHub Pages (MM-5 / M4-1).
# One-time manual step: repo Settings -> Pages -> Source: "GitHub Actions" (see docs/DEPLOY.md).
# The site lives at https://pervincinal.github.io/InsiderTest/ — the Vite build uses base './'
# and the PWA files (sw.js, manifest.webmanifest) use relative paths, so the sub-path just works.
on:
  push:
    branches:
      - claude/tower-war-game-plan-weqwpb
      - main
    paths:
      - 'tower-clash/**'
      - '.github/workflows/tower-clash-pages.yml'
  workflow_dispatch:

# Only one Pages deployment at a time; do not cancel a deploy that is already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build web app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    defaults:
      run:
        working-directory: tower-clash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tower-clash/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: tower-clash/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    # Pages must be enabled once in repo Settings → Pages → Source: GitHub Actions, and the
    # `github-pages` environment must allow this branch; until then the deploy fails. It stays
    # continue-on-error so the branch is not permanently red over a stakeholder-gated step, but the
    # failure must not hide (BUG-26: it failed on every push for 11 days behind a green workflow):
    # the `Pages deploy status` job below annotates it and writes it to the run summary, and
    # `node tower-clash/scripts/ciStatus.mjs` reports this job's own conclusion in the daily report.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  # A separate job, not a last step of `deploy`: when the github-pages environment rejects the
  # branch, the deploy job ends before any of its steps run. Empty `page_url` = no deployment.
  pages-status:
    name: Pages deploy status
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: read
    steps:
      - name: Report the Pages deploy result
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$PAGE_URL" ]; then
            echo "GitHub Pages deployed: $PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if out=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>&1); then pages=enabled
          else
            out=${out%%$'\n'*}
            case "$out" in *"HTTP 404"*) pages=disabled ;; *) pages=unknown ;; esac
          fi
          if [ "$pages" = disabled ]; then
            msg="GitHub Pages is NOT enabled — enable it at Settings → Pages (Source: GitHub Actions); the privacy policy URL required by Apple and Google is not live"
          elif [ "$pages" = enabled ]; then
            msg="GitHub Pages deploy FAILED although Pages is enabled — most likely Settings → Environments → github-pages → Deployment branches does not allow '$BRANCH'; the privacy policy URL required by Apple and Google is not live"
          else
            msg="GitHub Pages deploy FAILED (Pages state unreadable: $out) — check Settings → Pages (Source: GitHub Actions) and Settings → Environments → github-pages; the privacy policy URL required by Apple and Google is not live"
          fi
          echo "::warning title=GitHub Pages deploy failed (BUG-26)::$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"
