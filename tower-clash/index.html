<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#4fb3da" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tower Clash" />
    <meta name="application-name" content="Tower Clash" />
    <meta name="description" content="Capture every tower. A Tower War-style RTS for the browser." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/fredoka-700-latin.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="./fonts/fredoka-500-latin.woff2" />
    <title>Tower Clash</title>
    <style>
      /* Fredoka (OFL, subsets bundled in public/fonts/). font-display: block so the canvas never
         paints a fallback face; main.ts waits for these before the first frame. */
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url('./fonts/fredoka-500-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 500;
        font-display: block;
        src: url('./fonts/fredoka-500-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('./fonts/fredoka-700-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 700;
        font-display: block;
        src: url('./fonts/fredoka-700-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #4fb3da;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overscroll-behavior: none;
        /* Safe-area insets, read by src/render/view.ts so the HUD stays clear of the notch / home bar. */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }
      canvas { display: block; touch-action: none; }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game"></canvas></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
